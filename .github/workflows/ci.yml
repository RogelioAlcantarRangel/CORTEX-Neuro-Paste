name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint (syntax)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run syntax lint
        run: python -m compileall -q backend

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install fastapi starlette uvicorn pyperclip

      - name: Run unit tests
        run: python -m unittest backend/test_config_unit.py backend/test_clipboard_mgr_unit.py

  websocket-protocol:
    name: WebSocket protocol contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install protocol test deps
        run: |
          python -m pip install --upgrade pip
          pip install fastapi starlette uvicorn pyperclip

      - name: Run WS protocol tests
        run: python -m unittest backend/test_ws_protocol_unit.py

  smoke-env-tests:
    name: Smoke tests (manual / environment)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Environment-dependent smoke tests
        run: |
          echo "These tests are intentionally excluded from CI automation:"
          echo "- backend/test_risks.py"
          echo "- backend/audit_e2e.py"
          echo "- backend/test_latency.py"
          echo "Run manually in a Windows desktop environment with backend + Logitech plugin active."
